x-shared: &shared
  restart: always
  image: docker.n8n.io/n8nio/n8n
  environment:
    # Database
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    - DB_POSTGRESDB_PORT=5432
    - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
    - DB_POSTGRESDB_USER=${POSTGRES_NON_ROOT_USER}
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_NON_ROOT_PASSWORD}
    # Queue
    - EXECUTIONS_MODE=queue
    - QUEUE_BULL_REDIS_HOST=redis
    - QUEUE_HEALTH_CHECK_ACTIVE=true
    - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
    # Security
    - N8N_ENCRYPTION_KEY=${ENCRYPTION_KEY}
    - N8N_SECURE_COOKIE=false     # disables the security coolie feature (not recommended)
    # Email settings
    - N8N_EMAIL_MODE=smtp
    - N8N_SMTP_HOST=${N8N_SMTP_HOST}
    - N8N_SMTP_USER=${N8N_SMTP_USER}
    - N8N_SMTP_PASS=${N8N_SMTP_PASS}
    - N8N_SMTP_SENDER=${N8N_SMTP_SENDER}
    - N8N_SMTP_PORT=${N8N_SMTP_PORT:-465}
    - N8N_SMTP_SSL=${N8N_SMTP_SSL:-true}
    # Timezone
    - GENERIC_TIMEZONE=${TZ}
    # Webhook
    - WEBHOOK_URL=${WEBHOOK_URL}
  links:
    - postgres
    - redis
  volumes:
    - /app/data/n8n/storage:/home/node/.n8n
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  postgres:
#    image: postgres:16
    build:
      context: .
      dockerfile: Postgresql.Dockerfile
    restart: unless-stopped
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - POSTGRES_NON_ROOT_USER
      - POSTGRES_NON_ROOT_PASSWORD
    # Comment if database should not be externally accessed
#    ports:
#      - "5432:5432"
    volumes:
      - /app/data/n8n/db:/var/lib/postgresql/data
#      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - /app/data/n8n/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      CONFIG_CONTENT: |-
        allow_anonymous false
        listener 1883
        listener 9001
        protocol websockets
        persistence true
        password_file /mosquitto/config/pwfile
        persistence_location /mosquitto/data/
    ports:
      - "${MQTT_PORT}:1883" #default mqtt port
      - "${MQTT_WS_PORT}:9001" #default mqtt port for websockets
    command:
      - /bin/sh
      - -c
      - |
        cf="/mosquitto/config/mosquitto.conf"
        pf="/mosquitto/config/pwfile"
        if [ ! -f $$pf ]; then
          echo "> Creating password file"
          touch $$pf
          chown mosquitto:mosquitto $$pf
          chmod 600 $$pf
          /usr/bin/mosquitto_passwd -b $$pf $$MQTTADMIN $$MQTTADMINPASS
        fi
        echo "> Running Eclipse-Mosquitto MQTT"
        /usr/sbin/mosquitto -c $$cf
    volumes:
      - /app/data/n8n/mosquitto:/mosquitto/data
    logging:
      options:
        max-size: "10m"
        max-file: "14"
    healthcheck:
      test: mosquitto_sub -u docker -P docker -t '$$SYS/broker/uptime' -C 1 -i healthcheck -W 3
      interval: 10s
      timeout: 5s
      retries: 2

  qdrant:
    image: qdrant/qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
      QDRANT__TELEMETRY_DISABLED: true
    ports:
      # HTTP API
      - "${QDRANT_API_PORT}:6333"
      # gRPC API
      # - "6334:6334"
    volumes:
      - /app/data/n8n/qdrant:/qdrant/storage
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://qdrant:6333/healthz']
      interval: 30s
      timeout: 10s
      retries: 5

  n8n:
    <<: *shared
    ports:
      - "5678:5678"

  n8n-worker:
    <<: *shared
    command: worker
    depends_on:
      - n8n
